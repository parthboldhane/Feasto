<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin dashboard — Feasto</title>
     <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
  </head>
  <body class="page">
    <header class="admin-header" role="banner">
      <a href="dashboard.html" class="admin-header__brand">
        <img src="../assets/images/logo.png" alt="" class="admin-header__logo" />
        <span class="admin-header__name">Feasto</span>
        <span class="admin-header__badge">Admin</span>
      </a>
      <nav class="navbar__links" aria-label="Admin">
        <a href="dashboard.html" class="is-active">Dashboard</a>
        <a href="orders.html">Orders</a>
        <a href="history.html">History</a>
        <a href="crowd.html">Crowd</a>
        <a href="feedback.html">Feedback</a>
        <a href="subscription.html">Subscription</a>
        <a href="#" id="nav-logout" data-action="logout">Logout</a>
      </nav>
    </header>
    <main class="page__main">
      <h1 class="page__title">Crowd overview</h1>
      <div id="admin-crowd-summary" class="grid-dashboard">
        <div class="card crowd-card">
          <h2 class="card__title">Crowd Meter</h2>
          <div class="crowd-meter">
            <div class="crowd-meter__track">
              <div
                id="crowd-meter-fill"
                class="crowd-meter__fill crowd-meter__fill--moderate"
                style="width:50%"
              ></div>
            </div>
          </div>
          <p id="crowd-suggestion" class="text-secondary">Loading crowd data...</p>
          <div class="card">
            <h3>Best Time to Visit</h3>
            <p id="best-time">-</p>
          </div>
          <div class="progress-bar">
            <div id="crowd-progress-fill" class="crowd-meter__fill crowd-meter__fill--moderate" style="width:50%"></div>
          </div>
          <p id="crowd-progress-text">-</p>
        </div>
      </div>
      <div class="grid-dashboard" style="margin-top: 1rem">
        <section class="card">
          <h2 class="card__title">Food Management</h2>
          <form id="food-form" class="crowd-form">
            <input class="input" type="text" id="food-name" name="food-name" placeholder="Name" required />
            <input class="input" type="number" id="food-price" name="food-price" placeholder="Price" required />
            <select class="select" id="food-category" name="food-category">
              <option value="snacks">Snacks</option>
              <option value="drinks">Drinks</option>
            </select>
            <input class="input" type="file" id="food-image" name="food-image" accept="image/*" />
            <button type="submit" class="btn btn--primary">Add Item</button>
          </form>
          <div id="admin-food-list" style="margin-top: 1rem"></div>
        </section>
        <section class="card">
          <h2 class="card__title">Feasto Coin Rule</h2>
          <p id="admin-coin-rule-text" style="margin: 0 0 1rem">Earn 5 coins for every Rs1 spent</p>
          <div class="coin-rule-controls">
            <input id="rupees-per-coin" class="input" type="number" placeholder="Coins per Rs1" min="1" />
            <button id="update-coin-rule" class="btn btn--primary" type="button">Update</button>
          </div>
        </section>
      </div>
    </main>
    <script type="module">
      import { protectRoute } from "../assets/js/route_guard.js";
      import { attachLogoutHandler } from "../assets/js/auth.js";
      import { initAdminCrowdSummary } from "../assets/js/crowd.js";
      import { initAdminSubscriptionGate } from "../assets/js/admin_subscription_gate.js";
      import { initAdminFoodManagement } from "../assets/js/feasto_demo.js";

      if (!protectRoute({ expectedRole: "admin" })) {
        throw new Error("Redirecting");
      }
      attachLogoutHandler("admin");
      initAdminSubscriptionGate();
      document.addEventListener("DOMContentLoaded", () => {
        initAdminCrowdSummary();
        initAdminFoodManagement();
      });
    </script>
  </body>
</html>
