<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crowd control — Feasto Admin</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
  </head>
  <body class="page">
    <header class="admin-header" role="banner">
      <a href="dashboard.html" class="admin-header__brand">
        <img src="../assets/images/logo.png" alt="" class="admin-header__logo" />
        <span class="admin-header__name">Feasto</span>
        <span class="admin-header__badge">Admin</span>
      </a>
      <nav class="navbar__links" aria-label="Admin">
        <a href="dashboard.html">Dashboard</a>
        <a href="orders.html">Orders</a>
        <a href="history.html">History</a>
        <a href="crowd.html" class="is-active">Crowd</a>
        <a href="feedback.html">Feedback</a>
        <a href="subscription.html">Subscription</a>
        <a href="#" id="nav-logout">Logout</a>
      </nav>
    </header>
    <main class="page__main">
      <h1 class="page__title">Crowd control</h1>
      <div class="card" style="max-width: 28rem; margin-bottom: 1rem">
        <h2 class="card__title">Set crowd value</h2>
        <div id="crowd-form-message" role="status"></div>
        <form id="crowd-form" class="crowd-form">
          <div class="field">
            <label for="crowd-value">Current crowd (number)</label>
            <input class="input" type="number" id="crowd-value" name="value" min="0" step="1" required />
          </div>
          <button type="submit" class="btn btn--primary">Update</button>
        </form>
      </div>
      <div id="crowd-preview"></div>
    </main>
    <script type="module">
      import { protectRoute } from "../assets/js/route_guard.js";
      import { attachLogoutHandler } from "../assets/js/auth.js";
      import { initAdminCrowdControl } from "../assets/js/crowd.js";
      import { initAdminSubscriptionGate } from "../assets/js/admin_subscription_gate.js";

      if (!protectRoute({ expectedRole: "admin" })) {
        throw new Error("Redirecting");
      }
      attachLogoutHandler("admin");
      initAdminSubscriptionGate();
      initAdminCrowdControl();
    </script>
  </body>
</html>
